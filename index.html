<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz App</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        #container {
            width: 90%;
            max-width: 650px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);

            padding: 30px;
            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        #timer {
            text-align: right;
            font-size: 20px;
            font-weight: bold;

            color: #38bdf8;

            margin-bottom: 20px;
        }

        #qno {
            color: #94a3b8;
            margin-bottom: 15px;
        }

        #question {
            font-size: 25px;
            margin-bottom: 25px;
        }

        .option {
            display: flex;
            align-items: center;

            padding: 15px;
            margin: 10px 0;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 12px;

            cursor: pointer;
        }

        .option:hover {
            background: rgba(56, 189, 248, 0.15);
        }

        .option input {
            margin-right: 12px;
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            width: 100%;
        }

        button {
            width: 100%;

            margin-top: 25px;
            padding: 14px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                90deg,
                #06b6d4,
                #3b82f6
            );

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result-box {
            text-align: center;
        }

        .result-box h1 {
            margin-bottom: 20px;
        }

        .result-box h2 {
            margin: 12px 0;
        }

        .result-box button {
            margin-top: 20px;
        }

    </style>

</head>

<body>


    <div id="container">

        <!-- Timer -->

        <div id="timer">
            Time: 02:00
        </div>


        <!-- Question Number -->

        <p id="qno">
            Question 1 of 5
        </p>


        <!-- Question -->

        <h2 id="question">
            Question
        </h2>


        <!-- Option 1 -->

        <div class="option">

            <input
                type="radio"
                name="option"
                id="option1"
            >

            <label for="option1">
                Option 1
            </label>

        </div>


        <!-- Option 2 -->

        <div class="option">

            <input
                type="radio"
                name="option"
                id="option2"
            >

            <label for="option2">
                Option 2
            </label>

        </div>


        <!-- Option 3 -->

        <div class="option">

            <input
                type="radio"
                name="option"
                id="option3"
            >

            <label for="option3">
                Option 3
            </label>

        </div>


        <!-- Option 4 -->

        <div class="option">

            <input
                type="radio"
                name="option"
                id="option4"
            >

            <label for="option4">
                Option 4
            </label>

        </div>


        <!-- Button -->

        <button>
            Next →
        </button>

    </div>


    <!-- JavaScript -->

    <script src="app.js"></script>

</body>

</html>
